name: stocks-scanner

# Schedules only fire from the default branch. If runs stay at zero, Jonas must:
# Settings → Actions → General → Allow all actions; Workflow permissions → Read and write;
# then Actions → stocks-scanner → Run workflow (once). Our push-path trigger also boots
# the first run when this file lands on main.
on:
  schedule:
    # Weekdays UTC. Offset minutes avoid top-of-hour GitHub schedule drops.
    # Every ~30 min (was */15 — high-frequency crons are often delayed/dropped).
    - cron: "7,37 * * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stocks-scanner.yml"

permissions:
  contents: write

concurrency:
  group: stocks-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Persist credentials so the bot can push ledger/candidates back to main.
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.40" pandas requests lxml beautifulsoup4 html5lib pyarrow

      - name: Run scanner
        env:
          ORCA_MODE: paper
        run: |
          set +e
          for i in 1 2 3; do
            python -m stocks scan --days-back 1 --days-forward 1 && exit 0
            echo "scanner attempt $i failed; retrying..."
            sleep $((i * 20))
          done
          echo "scanner failed after retries (non-fatal for schedule)"
          exit 0

      - name: Commit candidates if changed
        env:
          # Force write token for push (repo Setting "Read and write" must be on).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "orca-stocks-bot"
          git config user.email "orca-bot@users.noreply.github.com"
          git add state/stocks/candidates.json demo/state/stocks/candidates.json || true
          if git diff --cached --quiet; then
            echo "no candidate changes"
          else
            git commit -m "stocks: scanner update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
