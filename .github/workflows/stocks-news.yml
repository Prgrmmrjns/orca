name: stocks-news

# 24/7 news scan (incl. weekends / overnight). Offset minutes reduce schedule drops.
on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
  # Fallback if GitHub `schedule` stays silent: external cron can POST
  # repository_dispatch with event_type=orca-stocks-tick (needs a PAT with actions:write).
  repository_dispatch:
    types: [orca-stocks-tick, orca-stocks-news]
  push:
    branches: [main]
    paths:
      - ".github/workflows/stocks-news.yml"
      - "stocks/news_scan.py"
      - "stocks/news_tagger.py"

permissions:
  contents: write

concurrency:
  group: stocks-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.40" pandas requests lxml beautifulsoup4 html5lib pyarrow feedparser pyyaml

      - name: Run news scanner
        env:
          ORCA_MODE: paper
        run: |
          set +e
          for i in 1 2 3; do
            python -m stocks news && exit 0
            echo "news attempt $i failed; retrying..."
            sleep $((i * 15))
          done
          echo "news scan failed after retries (non-fatal)"
          exit 0

      - name: Commit news + candidates if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "orca-stocks-bot"
          git config user.email "orca-bot@users.noreply.github.com"
          git add state/stocks/news.json demo/state/stocks/news.json \
                  state/stocks/candidates.json demo/state/stocks/candidates.json || true
          if git diff --cached --quiet; then
            echo "no news changes"
          else
            git commit -m "stocks: news scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
