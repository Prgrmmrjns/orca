name: stocks-engine

on:
  schedule:
    # US open ~09:35 ET = 14:35 UTC (EST) / 13:35 UTC (EDT). Use both winter/summer-ish slots.
    - cron: "35 14 * * 1-5"   # ~09:35 ET standard time
    - cron: "35 13 * * 1-5"   # ~09:35 ET daylight time
    # Midday ~12:30 ET
    - cron: "30 17 * * 1-5"
    - cron: "30 16 * * 1-5"
    # After close ~16:15 ET
    - cron: "15 21 * * 1-5"
    - cron: "15 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stocks-engine
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.40" pandas requests lxml beautifulsoup4 html5lib pyarrow

      - name: Run paper engine (fills / exits / marks)
        env:
          ORCA_MODE: paper
        run: |
          set +e
          for i in 1 2 3; do
            python -m stocks engine --apply && exit 0
            echo "engine attempt $i failed; retrying..."
            sleep $((i * 15))
          done
          echo "engine failed after retries (non-fatal)"
          exit 0

      - name: Commit ledger if changed
        run: |
          git config user.name "orca-stocks-bot"
          git config user.email "orca-bot@users.noreply.github.com"
          git add state/stocks/ demo/state/stocks/ || true
          if git diff --cached --quiet; then
            echo "no ledger changes"
          else
            git commit -m "stocks: engine mark/fill $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
