name: stocks-engine

# Fills / exits / marks for all books. Frequent during US RTH so news entries fill promptly.
# If schedules stay at zero: Settings → Actions → Read and write; Run workflow once.
on:
  schedule:
    # Every 15 min during US cash session window (covers EST+EDT ≈ 13:30–21:00 UTC weekdays)
    - cron: "2,17,32,47 13-20 * * 1-5"
    # After-close mark (EST + EDT)
    - cron: "17 21 * * 1-5"
    - cron: "17 20 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stocks-engine.yml"

permissions:
  contents: write

concurrency:
  group: stocks-engine
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.40" pandas requests lxml beautifulsoup4 html5lib pyarrow feedparser

      - name: Run paper engine (fills / exits / marks)
        env:
          ORCA_MODE: paper
        run: |
          set +e
          for i in 1 2 3; do
            python -m stocks engine --apply && exit 0
            echo "engine attempt $i failed; retrying..."
            sleep $((i * 15))
          done
          echo "engine failed after retries (non-fatal)"
          exit 0

      - name: Commit multi-book ledgers if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "orca-stocks-bot"
          git config user.email "orca-bot@users.noreply.github.com"
          git add state/stocks/ demo/state/stocks/ || true
          if git diff --cached --quiet; then
            echo "no ledger changes"
          else
            git commit -m "stocks: multi-book engine mark/fill $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
