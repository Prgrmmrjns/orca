name: stocks-engine

# Schedules only fire from the default branch. If runs stay at zero, Jonas must:
# Settings → Actions → General → Allow all actions; Workflow permissions → Read and write;
# then Actions → stocks-engine → Run workflow (once). Pushing this file to main also
# triggers one engine catch-up via the paths filter below.
on:
  schedule:
    # US equity session (both EST and EDT slots). Offset minutes reduce drop risk.
    - cron: "37 14 * * 1-5"   # ~09:37 ET standard time
    - cron: "37 13 * * 1-5"   # ~09:37 ET daylight time
    - cron: "32 17 * * 1-5"   # midday EST
    - cron: "32 16 * * 1-5"   # midday EDT
    - cron: "17 21 * * 1-5"   # after close EST
    - cron: "17 20 * * 1-5"   # after close EDT
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stocks-engine.yml"

permissions:
  contents: write

concurrency:
  group: stocks-engine
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.40" pandas requests lxml beautifulsoup4 html5lib pyarrow

      - name: Run paper engine (fills / exits / marks)
        env:
          ORCA_MODE: paper
        run: |
          set +e
          for i in 1 2 3; do
            python -m stocks engine --apply && exit 0
            echo "engine attempt $i failed; retrying..."
            sleep $((i * 15))
          done
          echo "engine failed after retries (non-fatal)"
          exit 0

      - name: Commit multi-book ledgers if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "orca-stocks-bot"
          git config user.email "orca-bot@users.noreply.github.com"
          git add state/stocks/ demo/state/stocks/ || true
          if git diff --cached --quiet; then
            echo "no ledger changes"
          else
            git commit -m "stocks: multi-book engine mark/fill $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash origin main || true
            git push origin HEAD:main
          fi
