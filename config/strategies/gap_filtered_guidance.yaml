# Frozen box-backtest winner (test +4.4% vs SPY). min_gap_pct 5.0 is percent points (same as market gap_pct).
book_id: gap_filtered_guidance
title: Gap-filtered guidance
description: Long guidance raises with an opening-gap filter (≥5%).
started: "2026-11-10"

max_positions: 8
max_per_ticker: 1
max_gross_exposure_pct: 0.40
cost_per_fill_pct: 0.005
allow_shorts: false
cooldown_minutes: null
sizing: fixed
vol_lookback_days: 20
vol_target_pct: 2.0
score_ref: 10.0
chart_filter: null
guidance_bridge: true

rules:
  - name: guidance_raise
    enabled: true
    categories: [guidance_raise]
    sources: [8-K, PRN, CNBC, MarketWatch]
    side: long
    exclude_tags: []
    min_gap_pct: 5.0
    max_gap_pct: null
    min_eps_surprise_pct: null
    max_eps_surprise_pct: null
    min_price: null
    min_avg_dollar_volume: null
    entry: next_open
    size_pct: 0.05
    hold:
      days: 5
    exits:
      stop_pct: null
      take_profit_pct: null
      trailing_stop_pct: null
      exit_at_close: false
