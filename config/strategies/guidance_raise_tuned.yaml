# Frozen box-backtest winner (train Mar10–Sep9 / test Sep10–Nov10, test +11.2% vs SPY).
# Translated from backtest YAML: size/cost/gross percent-points → fractions; entry next_open.
book_id: guidance_raise_tuned
title: Guidance raise tuned
description: Long guidance raises only; hold/size/max positions chosen on the first half.
started: "2026-11-10"

max_positions: 15
max_per_ticker: 1
max_gross_exposure_pct: 0.75
cost_per_fill_pct: 0.005
allow_shorts: false
cooldown_minutes: null
sizing: fixed
vol_lookback_days: 20
vol_target_pct: 2.0
score_ref: 10.0
chart_filter: null
guidance_bridge: true

rules:
  - name: guidance_raise
    enabled: true
    categories: [guidance_raise]
    sources: [8-K, PRN, CNBC, MarketWatch]
    side: long
    exclude_tags: []
    min_gap_pct: null
    max_gap_pct: null
    min_eps_surprise_pct: null
    max_eps_surprise_pct: null
    min_price: null
    min_avg_dollar_volume: null
    entry: next_open
    size_pct: 0.05
    hold:
      days: 5
    exits:
      stop_pct: null
      take_profit_pct: null
      trailing_stop_pct: null
      exit_at_close: false
